<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Treinos</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5f7f5;--card:#fff;--line:#dde7e1;--text:#102018;--muted:#708078;--green:#19DD7F;--dark:#0E1A14;--danger:#c54040}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#0cae61}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font:inherit;color:var(--text)}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--green);font-weight:800;color:#07150d;cursor:pointer}.btn.alt{background:var(--dark);color:white}.btn.ghost{background:#eef3f0;color:var(--text)}.btn.danger{background:#fff0f0;color:var(--danger)}h1,h2,h3{margin-top:0}.workout{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.exercise{display:grid;grid-template-columns:1.7fr .6fr .9fr .8fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.exercise:first-of-type{border-top:0}.muted{color:var(--muted);font-size:13px}.login{max-width:420px;margin:8vh auto}.hidden{display:none}@media(max-width:760px){.exercise{grid-template-columns:1fr 1fr}.exercise .name{grid-column:1/-1}.exercise .actions{grid-column:1/-1}.top{align-items:flex-start}}</style></head><body><div id="app"></div><script>
const URL='https://xwihrxinweeadtcouhoo.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Inh3aWhyeGlud2VlYWR0Y291aG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDA3MjIsImV4cCI6MjEwMDkxNjcyMn0.y0wEFqtP3VTdzDCNKwy_nSBK764qCPLpE1jdAvJx-AI';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let patients=[],selected=null,workouts=[],exercises={};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function loginView(){app.innerHTML=`<div class="wrap"><div class="card login"><div class="tag">Administração</div><h1>Treinamentos</h1><p class="muted">Entre com sua conta administrativa.</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="password" type="password"></div><button class="btn" id="login" style="margin-top:12px">Entrar</button><div id="err" class="muted" style="margin-top:10px"></div></div></div>`;login.onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)err.textContent='Não foi possível entrar.';};}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){loginView();}else await loadPatients();sb.auth.onAuthStateChange(async(_e,s)=>{if(s)await loadPatients();else loginView();});}
async function loadPatients(){const {data,error}=await sb.from('pacientes').select('id,nome,email,status').order('nome');if(error){app.innerHTML=`<div class="wrap"><div class="card">Esta conta não tem permissão administrativa para gerenciar treinos.</div></div>`;return;}patients=data||[];if(!selected&&patients[0])selected=patients[0].id;await loadWorkouts();render();}
async function loadWorkouts(){if(!selected){workouts=[];return;}const {data}=await sb.from('treino_programas').select('*').eq('paciente_id',selected).order('ordem');workouts=data||[];exercises={};for(const w of workouts){const {data:e}=await sb.from('treino_exercicios').select('*').eq('treino_id',w.id).order('bloco_ordem').order('ordem');exercises[w.id]=e||[];}}
async function choosePatient(id){selected=id;await loadWorkouts();render();}
async function addWorkout(){const nome=prompt('Nome do treino (ex.: Treino A · Inferiores)');if(!nome)return;const objetivo=prompt('Objetivo/ênfase do treino (opcional)')||'';const ordem=workouts.length;const {error}=await sb.from('treino_programas').insert({paciente_id:selected,nome,objetivo,ordem,status:'ativo'});if(error)return alert('Não foi possível criar o treino.');await loadWorkouts();render();}
async function addExercise(wid){const nome=prompt('Nome do exercício');if(!nome)return;const series=Number(prompt('Número de séries','3')||3);const repeticoes=prompt('Repetições (ex.: 8–10)','8–10')||'';const descanso=Number(prompt('Descanso em segundos','60')||60);const list=exercises[wid]||[];const {error}=await sb.from('treino_exercicios').insert({treino_id:wid,nome,series,repeticoes,descanso_seg:descanso,ordem:list.length});if(error)return alert('Não foi possível adicionar o exercício.');await loadWorkouts();render();}
async function editExercise(id,wid){const ex=(exercises[wid]||[]).find(x=>x.id===id);if(!ex)return;const nome=prompt('Nome',ex.nome);if(!nome)return;const series=Number(prompt('Séries',ex.series)||ex.series);const repeticoes=prompt('Repetições',ex.repeticoes||'')??ex.repeticoes;const rir=prompt('RIR (opcional)',ex.rir||'')??ex.rir;const descanso=Number(prompt('Descanso em segundos',ex.descanso_seg||60)||ex.descanso_seg||60);const observacoes=prompt('Orientações/observações',ex.observacoes||'')??ex.observacoes;const video_url=prompt('Link de vídeo (opcional)',ex.video_url||'')??ex.video_url;const {error}=await sb.from('treino_exercicios').update({nome,series,repeticoes,rir,descanso_seg:descanso,observacoes,video_url}).eq('id',id);if(error)return alert('Erro ao atualizar.');await loadWorkouts();render();}
async function delExercise(id){if(!confirm('Excluir este exercício?'))return;await sb.from('treino_exercicios').delete().eq('id',id);await loadWorkouts();render();}
async function archiveWorkout(id){if(!confirm('Arquivar este treino? Ele deixará de aparecer para o aluno.'))return;await sb.from('treino_programas').update({status:'arquivado'}).eq('id',id);await loadWorkouts();render();}
async function cloneWorkout(id){const source=workouts.find(w=>w.id===id);if(!source)return;const nome=prompt('Nome da cópia',source.nome+' · Cópia');if(!nome)return;const {data:newW,error}=await sb.from('treino_programas').insert({paciente_id:selected,nome,objetivo:source.objetivo,bloco:source.bloco,ordem:workouts.length,status:'ativo',observacoes:source.observacoes}).select().single();if(error)return alert('Erro ao copiar treino.');const list=(exercises[id]||[]).map(({id,treino_id,created_at,updated_at,...e})=>({...e,treino_id:newW.id}));if(list.length)await sb.from('treino_exercicios').insert(list);await loadWorkouts();render();}
async function logout(){await sb.auth.signOut();}
function render(){const p=patients.find(x=>x.id===selected);app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">NUTRI THALES</div><div class="tag">Admin · Treinamentos</div></div><button class="btn ghost" id="logout">Sair</button></div><div class="card"><div class="row"><div class="field"><label>Paciente</label><select id="patient">${patients.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.nome||x.email||'Paciente')}</option>`).join('')}</select></div><div style="display:flex;align-items:flex-end"><button class="btn" id="addWorkout">+ Novo treino</button></div></div>${p?`<div class="muted" style="margin-top:10px">${esc(p.email||'')}</div>`:''}</div>${workouts.length?workouts.map(w=>`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="tag">${esc(w.status)}</div><h2 style="margin:5px 0">${esc(w.nome)}</h2><div class="muted">${esc(w.objetivo||'Sem objetivo descrito')}</div></div><div class="row"><button class="btn ghost" data-copy="${w.id}">Duplicar</button><button class="btn danger" data-archive="${w.id}">Arquivar</button></div></div><div class="workout">${(exercises[w.id]||[]).length?(exercises[w.id]||[]).map((e,i)=>`<div class="exercise"><div class="name"><b>${i+1}. ${esc(e.nome)}</b><div class="muted">${esc(e.observacoes||'')}</div></div><div><b>${e.series}</b><div class="muted">séries</div></div><div><b>${esc(e.repeticoes||'—')}</b><div class="muted">reps</div></div><div><b>${e.descanso_seg||'—'}${e.descanso_seg?'s':''}</b><div class="muted">descanso</div></div><div class="actions row"><button class="btn ghost" data-edit="${e.id}" data-w="${w.id}">Editar</button><button class="btn danger" data-del="${e.id}">Excluir</button></div></div>`).join(''):`<div class="muted">Nenhum exercício cadastrado.</div>`}<button class="btn alt" data-addex="${w.id}" style="margin-top:12px">+ Adicionar exercício</button></div></div>`).join(''):`<div class="card"><div class="muted">Nenhum treino cadastrado para este paciente.</div></div>`}</div>`;patient.onchange=e=>choosePatient(e.target.value);addWorkout.onclick=addWorkout;logout.onclick=logout;document.querySelectorAll('[data-addex]').forEach(b=>b.onclick=()=>addExercise(b.dataset.addex));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editExercise(b.dataset.edit,b.dataset.w));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delExercise(b.dataset.del));document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>archiveWorkout(b.dataset.archive));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>cloneWorkout(b.dataset.copy));}
boot();
</script></body></html>
