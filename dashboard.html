<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Treinos · Nutri Thales</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"Galano Grotesque Alt";src:url("https://www.nutrithales.com.br/assets/fonts/GalanoGrotesqueAltRegular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Galano Grotesque Alt";src:url("https://www.nutrithales.com.br/assets/fonts/GalanoGrotesqueAltSemiBold.otf") format("opentype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Galano Grotesque Alt";src:url("https://www.nutrithales.com.br/assets/fonts/GalanoGrotesqueAltBold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Galano Grotesque Alt";src:url("https://www.nutrithales.com.br/assets/fonts/GalanoGrotesqueAltExtraBold.otf") format("opentype");font-weight:800;font-style:normal;font-display:swap}
:root{--bg:#0E1A14;--card:#15251d;--card2:#1b2f25;--line:#294337;--green:#19DD7F;--text:#f5fff9;--muted:#9db3a7;--danger:#ff7d7d;--shadow:0 12px 35px rgba(0,0,0,.22)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0E1A14,#0a130f);color:var(--text);font-family:"Galano Grotesque Alt",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(920px,100%);margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.2px}.tag{font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.14em}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#07120c;font-weight:800;cursor:pointer;font-family:inherit}.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--danger);border:1px solid #6c3737}.btn.pdf{display:inline-flex;gap:8px;align-items:center}.btn[disabled]{opacity:.55;cursor:not-allowed}.card{background:rgba(21,37,29,.96);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{font-size:27px;margin:4px 0 6px}.hero p{margin:0;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 14px;cursor:pointer;font-family:inherit}.tab.active{background:var(--green);color:#07120c;border-color:var(--green);font-weight:800}.exercise{padding:16px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise h3{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#0f1c16;color:var(--text);border-radius:12px;padding:11px;font:inherit}.sets{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.set{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#102018;color:var(--text);font-weight:800;cursor:pointer}.set.done{background:var(--green);color:#07120c;border-color:var(--green)}.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px}.status{font-size:12px;color:var(--muted);margin-top:8px}.status.ok{color:var(--green)}.empty{text-align:center;padding:32px 12px;color:var(--muted)}.login{max-width:420px;margin:8vh auto 0}.login h1{margin-bottom:6px}.login .field{margin:12px 0}.error{color:#ff9c9c;font-size:13px;margin-top:10px}.footerbar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,15,11,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px env(safe-area-inset-bottom);z-index:20}.footerin{width:min(920px,100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;background:#1d3127;border-radius:999px;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--green);width:0}.small{font-size:12px;color:var(--muted)}
#pdfStage{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#102018;z-index:-1;font-family:"Galano Grotesque Alt",Arial,sans-serif}
.pdf-doc{width:760px;background:#fff;color:#132019;padding:44px 46px 56px}.pdf-cover{min-height:970px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#0E1A14 0%,#13271d 70%,#173828 100%);color:#fff;margin:-44px -46px 38px;padding:54px 50px}.pdf-logo{width:150px;max-height:72px;object-fit:contain;object-position:left center;filter:brightness(0) invert(1)}.pdf-eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#19DD7F;font-weight:700;margin-bottom:14px}.pdf-cover h1{font-size:48px;line-height:1.02;margin:0;max-width:560px;font-weight:800;letter-spacing:-.04em}.pdf-cover .patient{font-size:26px;margin-top:22px;font-weight:600}.pdf-cover .cover-meta{display:flex;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.18);padding-top:18px;font-size:12px;color:#c5d5cc}.pdf-intro{margin:0 0 28px;padding:20px 22px;background:#f4f7f5;border:1px solid #dfe9e3;border-radius:16px;line-height:1.55;font-size:13px}.pdf-workout{margin:0 0 30px;page-break-inside:avoid}.pdf-workout-head{border-left:5px solid #19DD7F;padding:3px 0 4px 16px;margin:0 0 12px}.pdf-workout-head h2{font-size:25px;line-height:1.08;margin:0 0 6px;color:#102018}.pdf-workout-head p{font-size:12px;color:#66766d;margin:0}.pdf-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;overflow:hidden;border:1px solid #dce6df;border-radius:14px}.pdf-table th{background:#102018;color:#fff;text-align:left;padding:10px 9px;font-size:10px;letter-spacing:.04em;text-transform:uppercase}.pdf-table td{padding:10px 9px;vertical-align:top;border-top:1px solid #e2eae5;color:#26352d;line-height:1.35}.pdf-table tr:first-child td{border-top:0}.pdf-table td.exercise-name{font-weight:700;color:#102018;width:30%}.pdf-observation{margin-top:6px;color:#6d7b73;font-size:10px}.pdf-footer-note{margin-top:32px;padding-top:14px;border-top:1px solid #dce6df;font-size:10px;color:#738078;display:flex;justify-content:space-between;gap:16px}
@media(max-width:600px){.wrap{padding:14px 12px 92px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:23px}.card{border-radius:17px}.top{align-items:flex-start}.top .btn{padding:9px 11px}.top-actions{max-width:58%}.btn.pdf{font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="pdfStage" aria-hidden="true"></div>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Inh3aWhyeGlud2VlYWR0Y291aG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDA3MjIsImV4cCI6MjEwMDkxNjcyMn0.y0wEFqtP3VTdzDCNKwy_nSBK764qCPLpE1jdAvJx-AI';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,patient:null,workouts:[],exercises:[],active:null,progress:{exerciseState:{},activeWorkoutId:null,generalObs:{}},saving:false,saved:true,error:'',pdfGenerating:false};
let saveTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function renderLogin(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="login card"><div class="tag">Área de treinamento</div><h1>Entrar</h1><p class="small">Use o mesmo e-mail e senha da sua área de paciente.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Entrar</button><div class="error" id="loginError"></div></div></div>`;$('#loginBtn').onclick=login;}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email,password});if(error)$('#loginError').textContent='Não foi possível entrar. Confira e-mail e senha.';}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session?.user) await loadUser(session.user);else renderLogin();sb.auth.onAuthStateChange(async(_e,session)=>{if(session?.user)await loadUser(session.user);else renderLogin();});}
async function loadUser(user){state.user=user;const {data:patient,error:pErr}=await sb.from('pacientes').select('id,nome,email,status').eq('auth_id',user.id).maybeSingle();if(pErr||!patient){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card empty">Sua conta está autenticada, mas ainda não está vinculada a um paciente. Fale com o consultório.</div></div>`;return;}state.patient=patient;const [{data:workouts},{data:progress}]=await Promise.all([sb.from('treino_programas').select('*').eq('paciente_id',patient.id).eq('status','ativo').order('ordem'),sb.from('treino_progresso').select('dados').eq('paciente_id',patient.id).maybeSingle()]);state.workouts=workouts||[];if(progress?.dados)state.progress={exerciseState:{},activeWorkoutId:null,generalObs:{},...progress.dados};if(!state.progress.activeWorkoutId&&state.workouts[0])state.progress.activeWorkoutId=state.workouts[0].id;state.active=state.workouts.find(w=>w.id===state.progress.activeWorkoutId)||state.workouts[0]||null;await loadExercises();render();}
async function loadExercises(){if(!state.active){state.exercises=[];return;}const {data}=await sb.from('treino_exercicios').select('*').eq('treino_id',state.active.id).order('bloco_ordem').order('ordem');state.exercises=data||[];}
function exState(id){return state.progress.exerciseState[id]||{load:'',reps:'',sets:{}};}
function setProgress(mut){mut();state.saved=false;renderSaveStatus();clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,600);}
async function saveProgress(){if(!state.patient)return;state.saving=true;renderSaveStatus();const {error}=await sb.from('treino_progresso').upsert({paciente_id:state.patient.id,dados:state.progress},{onConflict:'paciente_id'});state.saving=false;state.saved=!error;state.error=error?'Erro ao salvar':'';renderSaveStatus();}
function renderSaveStatus(){const el=document.getElementById('saveStatus');if(!el)return;el.textContent=state.saving?'Salvando…':state.saved?'Salvo automaticamente':'Alterações pendentes';el.className='status '+(state.saved?'ok':'');}
async function changeWorkout(id){state.progress.activeWorkoutId=id;state.active=state.workouts.find(w=>w.id===id);await loadExercises();setProgress(()=>{});render();}
function toggleSet(exId,n){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets}};e.sets[n]=!e.sets[n];state.progress.exerciseState={...state.progress.exerciseState,[exId]:e};});render();}
function changeField(exId,key,value){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets},[key]:value};state.progress.exerciseState={...state.progress.exerciseState,[exId]:e};});}
function changeObs(value){setProgress(()=>{state.progress.generalObs={...state.progress.generalObs,[state.active.id]:value};});}
function completion(){let total=0,done=0;for(const ex of state.exercises){for(let i=1;i<=ex.series;i++){total++;if(exState(ex.id).sets?.[i])done++;}}return {total,done,pct:total?Math.round(done/total*100):0};}
async function finishWorkout(){if(!state.active)return;const c=completion();if(c.done<c.total&&!confirm('Ainda existem séries não marcadas. Deseja concluir mesmo assim?'))return;const started=new Date();const {error}=await sb.from('treino_execucoes').insert({paciente_id:state.patient.id,treino_id:state.active.id,iniciado_em:started.toISOString(),finalizado_em:new Date().toISOString(),concluido:true,observacoes:state.progress.generalObs?.[state.active.id]||'',dados:{exerciseState:state.progress.exerciseState}});if(error){alert('Não foi possível registrar a conclusão agora. Seu progresso continua salvo.');return;}alert('Treino concluído e registrado!');}
async function logout(){await sb.auth.signOut();}
function pdfMeta(ex){const parts=[];if(ex.series)parts.push(`${ex.series} séries`);if(ex.repeticoes)parts.push(esc(ex.repeticoes));if(ex.rir)parts.push(`RIR ${esc(ex.rir)}`);if(ex.rpe)parts.push(`RPE ${esc(ex.rpe)}`);if(ex.descanso_seg)parts.push(`${esc(ex.descanso_seg)}s`);return parts.join(' · ')}
function safeFileName(value){return String(value||'paciente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()}
async function getAllExercisesForPdf(){if(!state.workouts.length)return [];const ids=state.workouts.map(w=>w.id);const {data,error}=await sb.from('treino_exercicios').select('*').in('treino_id',ids).order('treino_id').order('bloco_ordem').order('ordem');if(error)throw error;return data||[]}
function buildPdfHtml(allExercises){const byWorkout={};for(const ex of allExercises)(byWorkout[ex.treino_id] ||= []).push(ex);const generated=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());const workouts=state.workouts.map((w,index)=>{const rows=(byWorkout[w.id]||[]).map((ex,i)=>`<tr><td class="exercise-name">${i+1}. ${esc(ex.nome)}${ex.observacoes?`<div class="pdf-observation">${esc(ex.observacoes)}</div>`:''}</td><td>${esc(ex.series||'—')}</td><td>${esc(ex.repeticoes||'—')}</td><td>${ex.rir?esc(ex.rir):'—'}</td><td>${ex.rpe?esc(ex.rpe):'—'}</td><td>${ex.descanso_seg?esc(ex.descanso_seg)+'s':'—'}</td></tr>`).join('');return `<section class="pdf-workout"><div class="pdf-workout-head"><div class="pdf-eyebrow">Treino ${String(index+1).padStart(2,'0')}</div><h2>${esc(w.nome)}</h2><p>${[w.bloco,w.objetivo].filter(Boolean).map(esc).join(' · ')||'Prescrição individualizada'}</p></div><table class="pdf-table"><thead><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>RIR</th><th>RPE</th><th>Desc.</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Nenhum exercício cadastrado.</td></tr>'}</tbody></table></section>`}).join('');return `<div class="pdf-doc"><section class="pdf-cover"><div><img class="pdf-logo" crossorigin="anonymous" src="https://www.nutrithales.com.br/assets/logo.png" alt="Thales Rosa"><div style="margin-top:110px"><div class="pdf-eyebrow">Programa de treinamento</div><h1>Seu plano completo de treinos</h1><div class="patient">${esc(state.patient.nome||'Paciente')}</div></div></div><div class="cover-meta"><span>Treinamento individualizado</span><span>Atualizado em ${generated}</span></div></section><div class="pdf-intro"><strong>Como usar este material</strong><br>Este PDF reúne todos os treinos ativos do seu programa. Respeite as orientações de séries, repetições, RIR, RPE e descanso. Para registrar cargas, concluir séries e acompanhar sua evolução, continue utilizando a área de treinamento.</div>${workouts}<div class="pdf-footer-note"><span>Thales Rosa · Treinamento e Nutrição</span><span>nutrithales.com.br</span></div></div>`}
async function downloadWorkoutsPdf(){if(state.pdfGenerating||!state.patient||!state.workouts.length)return;state.pdfGenerating=true;const btn=document.getElementById('pdfBtn');if(btn){btn.disabled=true;btn.innerHTML='Gerando PDF…'}try{if(document.fonts?.ready)await document.fonts.ready;const allExercises=await getAllExercisesForPdf();const stage=document.getElementById('pdfStage');stage.innerHTML=buildPdfHtml(allExercises);await new Promise(r=>setTimeout(r,250));const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'pt',format:'a4',compress:true});await new Promise((resolve,reject)=>{doc.html(stage.firstElementChild,{x:0,y:0,width:595,windowWidth:760,autoPaging:'text',html2canvas:{scale:1.35,useCORS:true,backgroundColor:'#ffffff',logging:false},callback:pdf=>{try{const pages=pdf.getNumberOfPages();for(let p=2;p<=pages;p++){pdf.setPage(p);pdf.setFontSize(8);pdf.setTextColor(110,125,116);pdf.text(`${state.patient.nome||'Paciente'} · Programa de treinamento`,38,818);pdf.text(`${p}/${pages}`,557,818,{align:'right'})}pdf.save(`treinos-${safeFileName(state.patient.nome)}.pdf`);resolve()}catch(e){reject(e)}}})});stage.innerHTML=''}catch(err){console.error(err);alert('Não foi possível gerar o PDF agora. Tente novamente em alguns instantes.')}finally{state.pdfGenerating=false;if(btn){btn.disabled=false;btn.innerHTML='↓ Baixar PDF'}}}
function render(){if(!state.patient)return;const c=completion();const workoutTabs=state.workouts.map(w=>`<button class="tab ${state.active?.id===w.id?'active':''}" data-id="${w.id}">${esc(w.nome)}</button>`).join('');const exercises=state.exercises.map(ex=>{const st=exState(ex.id);const sets=Array.from({length:ex.series},(_,i)=>`<button class="set ${st.sets?.[i+1]?'done':''}" data-set="${i+1}" data-ex="${ex.id}">${i+1}</button>`).join('');return `<div class="exercise"><h3>${esc(ex.nome)}</h3><div class="meta">${ex.series} séries · ${esc(ex.repeticoes||'repetições livres')}${ex.rir?' · RIR '+esc(ex.rir):''}${ex.rpe?' · RPE '+esc(ex.rpe):''}${ex.descanso_seg?' · '+ex.descanso_seg+'s descanso':''}</div><div class="sets">${sets}</div><div class="grid"><div class="field"><label>Carga</label><input inputmode="decimal" value="${esc(st.load)}" data-field="load" data-ex="${ex.id}" placeholder="kg"></div><div class="field"><label>Repetições</label><input inputmode="numeric" value="${esc(st.reps)}" data-field="reps" data-ex="${ex.id}" placeholder="realizadas"></div></div>${ex.observacoes?`<div class="note">${esc(ex.observacoes)}</div>`:''}${ex.video_url?`<div class="note"><a href="${esc(ex.video_url)}" target="_blank" style="color:var(--green)">Ver execução do exercício</a></div>`:''}</div>`}).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">NUTRI THALES</div><div class="tag">Treinamento</div></div><div class="top-actions">${state.workouts.length?'<button class="btn alt pdf" id="pdfBtn">↓ Baixar PDF</button>':''}<button class="btn alt" id="logout">Sair</button></div></div><div class="card hero"><div class="small">Olá,</div><h1>${esc(state.patient.nome||'Aluno')}</h1><p>${state.active?esc(state.active.objetivo||'Seu treino está pronto para hoje.'):'Nenhum treino ativo cadastrado.'}</p><div id="saveStatus" class="status ok">Salvo automaticamente</div></div>${state.workouts.length?`<div class="tabs">${workoutTabs}</div>`:''}${state.active?`<div class="card"><div class="tag">Treino atual</div><h2 style="margin:6px 0 2px">${esc(state.active.nome)}</h2>${state.active.bloco?`<div class="small">${esc(state.active.bloco)}</div>`:''}${exercises||'<div class="empty">Nenhum exercício cadastrado neste treino.</div>'}<div class="field" style="margin-top:15px"><label>Observações do treino</label><textarea id="generalObs" rows="4" placeholder="Como você se sentiu? Alguma dor, dificuldade ou observação?">${esc(state.progress.generalObs?.[state.active.id]||'')}</textarea></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="finish">Concluir treino</button></div></div>`:`<div class="card empty">Ainda não há treino ativo vinculado à sua conta.</div>`}</div><div class="footerbar"><div class="footerin"><div style="min-width:92px"><b>${c.pct}%</b><div class="small">${c.done}/${c.total} séries</div></div><div class="progress"><div style="width:${c.pct}%"></div></div></div></div>`;$('#logout').onclick=logout;if($('#pdfBtn'))$('#pdfBtn').onclick=downloadWorkoutsPdf;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>changeWorkout(b.dataset.id));document.querySelectorAll('.set').forEach(b=>b.onclick=()=>toggleSet(b.dataset.ex,Number(b.dataset.set)));document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>changeField(i.dataset.ex,i.dataset.field,i.value));if($('#generalObs'))$('#generalObs').oninput=e=>changeObs(e.target.value);if($('#finish'))$('#finish').onclick=finishWorkout;renderSaveStatus();}
boot();
</script>
</body>
</html>
