<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Treinos · Nutri Thales</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0E1A14;--card:#15251d;--card2:#1b2f25;--line:#294337;--green:#19DD7F;--text:#f5fff9;--muted:#9db3a7;--danger:#ff7d7d;--shadow:0 12px 35px rgba(0,0,0,.22)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0E1A14,#0a130f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(920px,100%);margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.2px}.tag{font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.14em}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#07120c;font-weight:800;cursor:pointer}.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--danger);border:1px solid #6c3737}.card{background:rgba(21,37,29,.96);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{font-size:27px;margin:4px 0 6px}.hero p{margin:0;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:var(--green);color:#07120c;border-color:var(--green);font-weight:800}.exercise{padding:16px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.exercise h3{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#0f1c16;color:var(--text);border-radius:12px;padding:11px;font:inherit}.sets{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.set{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#102018;color:var(--text);font-weight:800;cursor:pointer}.set.done{background:var(--green);color:#07120c;border-color:var(--green)}.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px}.status{font-size:12px;color:var(--muted);margin-top:8px}.status.ok{color:var(--green)}.empty{text-align:center;padding:32px 12px;color:var(--muted)}.login{max-width:420px;margin:8vh auto 0}.login h1{margin-bottom:6px}.login .field{margin:12px 0}.error{color:#ff9c9c;font-size:13px;margin-top:10px}.footerbar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,15,11,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px env(safe-area-inset-bottom);z-index:20}.footerin{width:min(920px,100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;background:#1d3127;border-radius:999px;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--green);width:0}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.wrap{padding:14px 12px 92px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:23px}.card{border-radius:17px}.top{align-items:flex-start}.top .btn{padding:9px 11px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Inh3aWhyeGlud2VlYWR0Y291aG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDA3MjIsImV4cCI6MjEwMDkxNjcyMn0.y0wEFqtP3VTdzDCNKwy_nSBK764qCPLpE1jdAvJx-AI';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,patient:null,workouts:[],exercises:[],active:null,progress:{exerciseState:{},activeWorkoutId:null,generalObs:{}},saving:false,saved:true,error:''};
let saveTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function renderLogin(){document.getElementById('app').innerHTML=`<div class="wrap"><div class="login card"><div class="tag">Área de treinamento</div><h1>Entrar</h1><p class="small">Use o mesmo e-mail e senha da sua área de paciente.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Entrar</button><div class="error" id="loginError"></div></div></div>`;$('#loginBtn').onclick=login;}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#loginError').textContent='';const {error}=await sb.auth.signInWithPassword({email,password});if(error)$('#loginError').textContent='Não foi possível entrar. Confira e-mail e senha.';}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session?.user) await loadUser(session.user);else renderLogin();sb.auth.onAuthStateChange(async(_e,session)=>{if(session?.user)await loadUser(session.user);else renderLogin();});}
async function loadUser(user){state.user=user;const {data:patient,error:pErr}=await sb.from('pacientes').select('id,nome,email,status').eq('auth_id',user.id).maybeSingle();if(pErr||!patient){document.getElementById('app').innerHTML=`<div class="wrap"><div class="card empty">Sua conta está autenticada, mas ainda não está vinculada a um paciente. Fale com o consultório.</div></div>`;return;}state.patient=patient;const [{data:workouts},{data:progress}]=await Promise.all([sb.from('treino_programas').select('*').eq('paciente_id',patient.id).eq('status','ativo').order('ordem'),sb.from('treino_progresso').select('dados').eq('paciente_id',patient.id).maybeSingle()]);state.workouts=workouts||[];if(progress?.dados)state.progress={exerciseState:{},activeWorkoutId:null,generalObs:{},...progress.dados};if(!state.progress.activeWorkoutId&&state.workouts[0])state.progress.activeWorkoutId=state.workouts[0].id;state.active=state.workouts.find(w=>w.id===state.progress.activeWorkoutId)||state.workouts[0]||null;await loadExercises();render();}
async function loadExercises(){if(!state.active){state.exercises=[];return;}const {data}=await sb.from('treino_exercicios').select('*').eq('treino_id',state.active.id).order('bloco_ordem').order('ordem');state.exercises=data||[];}
function exState(id){return state.progress.exerciseState[id]||{load:'',reps:'',sets:{}};}
function setProgress(mut){mut();state.saved=false;renderSaveStatus();clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,600);}
async function saveProgress(){if(!state.patient)return;state.saving=true;renderSaveStatus();const {error}=await sb.from('treino_progresso').upsert({paciente_id:state.patient.id,dados:state.progress},{onConflict:'paciente_id'});state.saving=false;state.saved=!error;state.error=error?'Erro ao salvar':'';renderSaveStatus();}
function renderSaveStatus(){const el=document.getElementById('saveStatus');if(!el)return;el.textContent=state.saving?'Salvando…':state.saved?'Salvo automaticamente':'Alterações pendentes';el.className='status '+(state.saved?'ok':'');}
async function changeWorkout(id){state.progress.activeWorkoutId=id;state.active=state.workouts.find(w=>w.id===id);await loadExercises();setProgress(()=>{});render();}
function toggleSet(exId,n){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets}};e.sets[n]=!e.sets[n];state.progress.exerciseState={...state.progress.exerciseState,[exId]:e};});render();}
function changeField(exId,key,value){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets},[key]:value};state.progress.exerciseState={...state.progress.exerciseState,[exId]:e};});}
function changeObs(value){setProgress(()=>{state.progress.generalObs={...state.progress.generalObs,[state.active.id]:value};});}
function completion(){let total=0,done=0;for(const ex of state.exercises){for(let i=1;i<=ex.series;i++){total++;if(exState(ex.id).sets?.[i])done++;}}return {total,done,pct:total?Math.round(done/total*100):0};}
async function finishWorkout(){if(!state.active)return;const c=completion();if(c.done<c.total&&!confirm('Ainda existem séries não marcadas. Deseja concluir mesmo assim?'))return;const started=new Date();const payload={patient_id:state.patient.id};const {data:exec,error}=await sb.from('treino_execucoes').insert({paciente_id:state.patient.id,treino_id:state.active.id,iniciado_em:started.toISOString(),finalizado_em:new Date().toISOString(),concluido:true,observacoes:state.progress.generalObs?.[state.active.id]||'',dados:{exerciseState:state.progress.exerciseState}}).select('id').single();if(error){alert('Não foi possível registrar a conclusão agora. Seu progresso continua salvo.');return;}alert('Treino concluído e registrado!');}
async function logout(){await sb.auth.signOut();}
function render(){if(!state.patient)return;const c=completion();const workoutTabs=state.workouts.map(w=>`<button class="tab ${state.active?.id===w.id?'active':''}" data-id="${w.id}">${esc(w.nome)}</button>`).join('');const exercises=state.exercises.map(ex=>{const st=exState(ex.id);const sets=Array.from({length:ex.series},(_,i)=>`<button class="set ${st.sets?.[i+1]?'done':''}" data-set="${i+1}" data-ex="${ex.id}">${i+1}</button>`).join('');return `<div class="exercise"><h3>${esc(ex.nome)}</h3><div class="meta">${ex.series} séries · ${esc(ex.repeticoes||'repetições livres')}${ex.rir?' · RIR '+esc(ex.rir):''}${ex.rpe?' · RPE '+esc(ex.rpe):''}${ex.descanso_seg?' · '+ex.descanso_seg+'s descanso':''}</div><div class="sets">${sets}</div><div class="grid"><div class="field"><label>Carga</label><input inputmode="decimal" value="${esc(st.load)}" data-field="load" data-ex="${ex.id}" placeholder="kg"></div><div class="field"><label>Repetições</label><input inputmode="numeric" value="${esc(st.reps)}" data-field="reps" data-ex="${ex.id}" placeholder="realizadas"></div></div>${ex.observacoes?`<div class="note">${esc(ex.observacoes)}</div>`:''}${ex.video_url?`<div class="note"><a href="${esc(ex.video_url)}" target="_blank" style="color:var(--green)">Ver execução do exercício</a></div>`:''}</div>`}).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">NUTRI THALES</div><div class="tag">Treinamento</div></div><button class="btn alt" id="logout">Sair</button></div><div class="card hero"><div class="small">Olá,</div><h1>${esc(state.patient.nome||'Aluno')}</h1><p>${state.active?esc(state.active.objetivo||'Seu treino está pronto para hoje.'):'Nenhum treino ativo cadastrado.'}</p><div id="saveStatus" class="status ok">Salvo automaticamente</div></div>${state.workouts.length?`<div class="tabs">${workoutTabs}</div>`:''}${state.active?`<div class="card"><div class="tag">Treino atual</div><h2 style="margin:6px 0 2px">${esc(state.active.nome)}</h2>${state.active.bloco?`<div class="small">${esc(state.active.bloco)}</div>`:''}${exercises||'<div class="empty">Nenhum exercício cadastrado neste treino.</div>'}<div class="field" style="margin-top:15px"><label>Observações do treino</label><textarea id="generalObs" rows="4" placeholder="Como você se sentiu? Alguma dor, dificuldade ou observação?">${esc(state.progress.generalObs?.[state.active.id]||'')}</textarea></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="finish">Concluir treino</button></div></div>`:`<div class="card empty">Ainda não há treino ativo vinculado à sua conta.</div>`}</div><div class="footerbar"><div class="footerin"><div style="min-width:92px"><b>${c.pct}%</b><div class="small">${c.done}/${c.total} séries</div></div><div class="progress"><div style="width:${c.pct}%"></div></div></div></div>`;$('#logout').onclick=logout;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>changeWorkout(b.dataset.id));document.querySelectorAll('.set').forEach(b=>b.onclick=()=>toggleSet(b.dataset.ex,Number(b.dataset.set)));document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>changeField(i.dataset.ex,i.dataset.field,i.value));if($('#generalObs'))$('#generalObs').oninput=e=>changeObs(e.target.value);if($('#finish'))$('#finish').onclick=finishWorkout;renderSaveStatus();}
boot();
</script>
</body>
</html>
